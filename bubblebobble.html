<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>버블보블</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0f2a 0%, #14245e 50%, #0b2b4d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            padding: 20px;
        }

        .game-board-container {
            position: relative;
        }

        .game-board {
            border: 4px solid #a0e8ff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(120, 210, 255, 0.55),
                        inset 0 0 30px rgba(0, 0, 0, 0.4);
            background: #06101f;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 150px;
        }

        .panel-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #a0e8ff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(120, 210, 255, 0.3);
        }

        .panel-title {
            color: #a0e8ff;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        .stat-value {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(120, 210, 255, 0.8);
        }

        .stat-value.high {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .stat-value.lives {
            color: #ff6b8a;
            text-shadow: 0 0 10px rgba(255, 107, 138, 0.8);
        }

        .controls {
            font-size: 11px;
            color: #aaa;
            line-height: 1.8;
        }

        .controls span {
            color: #a0e8ff;
            font-weight: bold;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            color: #a0e8ff;
            font-size: 40px;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(120, 210, 255, 0.9);
        }

        .overlay h1.bubble-title {
            color: #7ff0a0;
            text-shadow: 0 0 25px rgba(127, 240, 160, 0.9);
        }

        .overlay h2 {
            color: #ff6b8a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .overlay h2.clear {
            color: #7ff0a0;
            font-size: 32px;
            margin-bottom: 4px;
        }

        .overlay p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
            line-height: 1.7;
        }

        .overlay .level-name {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 14px;
            font-weight: bold;
        }

        .final-score {
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            margin: 8px 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        .btn {
            background: linear-gradient(135deg, #a0e8ff, #4090c0);
            color: #06101f;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(160, 232, 255, 0.7);
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-nav {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #a0e8ff;
            border-radius: 25px;
            padding: 6px 10px;
            box-shadow: 0 0 15px rgba(160, 232, 255, 0.4);
        }

        .game-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .game-nav a:hover {
            background: rgba(160, 232, 255, 0.3);
            color: #a0e8ff;
        }

        .game-nav a.active {
            background: linear-gradient(135deg, #a0e8ff, #4090c0);
            color: #06101f;
        }

        .touch-controls {
            display: none;
        }

        .touch-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(160, 232, 255, 0.15);
            border: 2px solid rgba(160, 232, 255, 0.6);
            color: #a0e8ff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.1s, background 0.1s;
        }

        .touch-btn.active,
        .touch-btn:active {
            transform: scale(0.85);
            background: rgba(160, 232, 255, 0.35);
        }

        @media (max-width: 900px), (pointer: coarse) {
            body {
                overflow: auto;
            }

            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 10px;
                gap: 15px;
            }

            .side-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                min-width: 0;
                max-width: 100%;
            }

            .side-panel .panel-box {
                padding: 8px 12px;
            }

            .panel-title {
                font-size: 11px;
                margin-bottom: 4px;
            }

            .stat-value {
                font-size: 18px;
            }

            .controls {
                display: none;
            }

            .game-board {
                width: min(94vw, 684px);
                height: auto;
            }

            .overlay h1 {
                font-size: 26px;
            }

            .overlay h2 {
                font-size: 20px;
            }

            .overlay h2.clear {
                font-size: 22px;
            }

            .overlay p {
                font-size: 13px;
            }

            .final-score {
                font-size: 26px;
            }

            .btn {
                padding: 10px 22px;
                font-size: 14px;
            }

            .touch-controls {
                display: flex;
                flex-wrap: nowrap;
                justify-content: center;
                align-items: center;
                gap: 12px;
                width: min(94vw, 420px);
                margin-top: 15px;
                padding-bottom: env(safe-area-inset-bottom);
            }

            .touch-btn {
                flex: 1 1 0;
                min-width: 48px;
                max-width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="game-nav">
        <a href="index.html">테트리스</a>
        <a href="bubblebobble.html" class="active">버블보블</a>
    </div>
    <div class="app">
    <div class="game-container">
        <div class="side-panel">
            <div class="panel-box">
                <div class="panel-title">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">High</div>
                <div class="stat-value high" id="highScore">0</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">Lives</div>
                <div class="stat-value lives" id="lives">♥♥♥</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="panel-box">
                <div class="panel-title">Enemies</div>
                <div class="stat-value" id="enemies">0</div>
            </div>
            <div class="panel-box controls">
                <div><span>← →</span> 이동</div>
                <div><span>↑ / W / Space</span> 점프</div>
                <div><span>J / Z / Shift</span> 거품 쏘기</div>
                <div><span>↑유지 + 쏘기</span> 위로 발사</div>
                <div><span>P</span> 일시정지</div>
            </div>
        </div>

        <div class="game-board-container">
            <canvas id="gameBoard" class="game-board" width="684" height="468"></canvas>

            <div class="overlay" id="startScreen">
                <h1 class="bubble-title">버블보블</h1>
                <p>거품으로 몬스터를 가두고 터뜨려 모두 물리치세요!</p>
                <p>거품 위에 올라타거나 닿으면 터집니다.</p>
                <div class="level-name">스테이지가 끝나면 그만큼 오릅니다!</div>
                <button class="btn" id="startBtn">게임 시작</button>
            </div>

            <div class="overlay hidden" id="pauseScreen">
                <h1>일시정지</h1>
                <button class="btn" id="resumeBtn">계속하기</button>
            </div>

            <div class="overlay hidden" id="clearScreen">
                <h2 class="clear">레벨 클리어!</h2>
                <div class="level-name" id="clearLevelName"></div>
                <p>클리어 보너스</p>
                <div class="final-score" id="clearBonus">+1000</div>
                <button class="btn" id="nextBtn">다음 레벨</button>
            </div>

            <div class="overlay hidden" id="gameOverScreen">
                <h2>게임 오버</h2>
                <p>최종 점수</p>
                <div class="final-score" id="finalScore">0</div>
                <button class="btn" id="restartBtn">다시하기</button>
            </div>
        </div>
    </div>

    <div class="touch-controls">
        <div class="touch-btn" id="leftBtn">◀</div>
        <div class="touch-btn" id="jumpBtn">▲</div>
        <div class="touch-btn" id="shootBtn">◎</div>
        <div class="touch-btn" id="rightBtn">▶</div>
    </div>

    <script src="bubblebobble.js"></script>
</body>
</html>
